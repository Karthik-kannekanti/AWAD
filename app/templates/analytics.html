<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous WAF Demo</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Chart.js -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/toolbox.css') }}">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        #site-iframe {
            width: 100%;
            height: 100vh;
            border: none;
        }
        .toolbox-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #0d6efd;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        .toolbox-toggle:hover {
            background-color: #0b5ed7;
            transform: scale(1.05);
        }
        .toolbox-toggle i {
            font-size: 24px;
        }
    </style>
</head>
<body>
    <!-- Target Website in iframe -->
    <iframe id="site-iframe" src="{{ target_website }}"></iframe>
    
    <!-- Toolbox Toggle Button -->
    <div class="toolbox-toggle" id="toolbox-toggle">
        <i class="fas fa-shield-alt"></i>
    </div>
    
    <!-- Floating Toolbox -->
    <div class="toolbox" id="toolbox">
        <div class="toolbox-header">
            <h5>Autonomous WAF Analytics</h5>
            <div class="toolbox-controls">
                <button class="btn btn-sm btn-outline-secondary" id="minimize-toolbox">
                    <i class="fas fa-minus"></i>
                </button>
                <button class="btn btn-sm btn-outline-secondary" id="expand-toolbox">
                    <i class="fas fa-expand"></i>
                </button>
                <button class="btn btn-sm btn-outline-secondary" id="close-toolbox">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
        <div class="toolbox-body">
            <ul class="nav nav-tabs" id="toolboxTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="stats-tab" data-bs-toggle="tab" data-bs-target="#stats" type="button" role="tab" aria-controls="stats" aria-selected="true">Stats</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="attack-tab" data-bs-toggle="tab" data-bs-target="#attack" type="button" role="tab" aria-controls="attack" aria-selected="false">Attack Simulation</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="logs-tab" data-bs-toggle="tab" data-bs-target="#logs" type="button" role="tab" aria-controls="logs" aria-selected="false">Recent Logs</button>
                </li>
            </ul>
            <div class="tab-content" id="toolboxTabContent">
                <!-- Stats Tab -->
                <div class="tab-pane fade show active" id="stats" role="tabpanel" aria-labelledby="stats-tab">
                    <div class="stats-container">
                        <div class="row">
                            <div class="col-md-4">
                                <div class="stat-card">
                                    <div class="stat-value" id="total-requests">0</div>
                                    <div class="stat-label">Total Requests</div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="stat-card">
                                    <div class="stat-value text-danger" id="blocked-requests">0</div>
                                    <div class="stat-label">Blocked</div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="stat-card">
                                    <div class="stat-value text-warning" id="anomalous-requests">0</div>
                                    <div class="stat-label">Anomalies</div>
                                </div>
                            </div>
                        </div>
                        <div class="chart-container">
                            <canvas id="stats-chart"></canvas>
                        </div>
                        <div class="dashboard-link">
                            <a href="http://localhost:5001" target="_blank" class="btn btn-primary btn-sm">
                                <i class="fas fa-external-link-alt"></i> Open Full Dashboard
                            </a>
                        </div>
                    </div>
                </div>
                
                <!-- Attack Simulation Tab -->
                <div class="tab-pane fade" id="attack" role="tabpanel" aria-labelledby="attack-tab">
                    <div class="attack-container">
                        <div class="attack-buttons">
                            <button class="btn btn-danger btn-sm attack-btn" data-attack="sql_injection">
                                <i class="fas fa-database"></i> SQL Injection
                            </button>
                            <button class="btn btn-warning btn-sm attack-btn" data-attack="xss">
                                <i class="fas fa-code"></i> XSS
                            </button>
                            <button class="btn btn-info btn-sm attack-btn" data-attack="path_traversal">
                                <i class="fas fa-folder-open"></i> Path Traversal
                            </button>
                            <button class="btn btn-dark btn-sm attack-btn" data-attack="command_injection">
                                <i class="fas fa-terminal"></i> Command Injection
                            </button>
                            <button class="btn btn-secondary btn-sm attack-btn" data-attack="lfi">
                                <i class="fas fa-file"></i> LFI
                            </button>
                        </div>
                        <div class="custom-attack">
                            <div class="input-group mb-3">
                                <input type="text" class="form-control" id="custom-payload" placeholder="Custom payload...">
                                <button class="btn btn-primary attack-btn" data-attack="custom" type="button">
                                    <i class="fas fa-play"></i> Test
                                </button>
                            </div>
                        </div>
                        <div class="attack-result" id="attack-result">
                            <div class="card">
                                <div class="card-header">
                                    <h6>Attack Simulation Result</h6>
                                </div>
                                <div class="card-body">
                                    <p>Click an attack button above to simulate an attack.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Logs Tab -->
                <div class="tab-pane fade" id="logs" role="tabpanel" aria-labelledby="logs-tab">
                    <div class="logs-container">
                        <div class="table-responsive">
                            <table class="table table-sm table-hover">
                                <thead>
                                    <tr>
                                        <th>Time</th>
                                        <th>Method</th>
                                        <th>Path</th>
                                        <th>Status</th>
                                        <th>Type</th>
                                    </tr>
                                </thead>
                                <tbody id="logs-table-body">
                                    <!-- Logs will be dynamically added here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="toolbox-footer">
            <small>Autonomous WAF Demo - For educational purposes only</small>
        </div>
    </div>
    
    <!-- Bootstrap 5 JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- jQuery UI for draggable and resizable -->
    <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.4.1/socket.io.min.js"></script>
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/toolbox.js') }}"></script>
</body>
</html>
